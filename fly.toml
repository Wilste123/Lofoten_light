# lofoten-coach — single app: API + static web on Fly
# Docs: docs/product/fly-deploy.md

app = 'lofoten-coach'
# Matches existing Fly app machines (ams). Prefer arn later if you migrate.
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  DATABASE_PATH = '/data/coach.db'
  ATHLETES_DATA_DIR = '/data/athletes'
  KNOWLEDGE_DIR = '/app/knowledge'
  STATIC_DIR = '/app/static'
  CORS_ORIGINS = '*'
  SEED_ON_BOOT = '1'
  OPENAI_MODEL = 'gpt-4o-mini'

[http_service]
  internal_port = 8080
  force_https = true
  # Keep one machine warm during pilot — phone should not wait on cold start
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '45s'
    method = 'GET'
    path = '/health'

[[mounts]]
  source = 'coach_data'
  destination = '/data'
  initial_size = '1gb'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
