science_note: >
  Intervals 8-12 min at ~95-100% FTP target fractional VO2 and lactate steady state
  (Seiler 2010; interval duration affects time above 90% VO2max). Fewer reps than 5x10
  but longer time at intensity — alternate weekly with 5x10.
