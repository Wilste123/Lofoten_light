name: Threshold 5x10
description: Repeated threshold bouts — fractional utilisation at FTP/MLSS (classic prep for 20-40 min steady)
sport: bike
phase: build
duration_min: 95
tss_estimate: 95
science_note: >
  Repeated work at or just below maximal lactate steady state improves time-to-exhaustion
  at threshold without a single monolithic 50 min block (Billat & Koralsztein 1996;
  Laursen & Jenkins 2002 meta-analysis on interval training). Use current FTP from 2026 test.
steps:
  - duration_min: 15
    power_pct_ftp: 55
    note: Warm-up + 3x30s openers @ 110%
  - duration_min: 10
    power_pct_ftp: 98
    note: Threshold 1 — steady cadence
  - duration_min: 5
    power_pct_ftp: 50
    note: Recovery spin
  - duration_min: 10
    power_pct_ftp: 98
    note: Threshold 2
  - duration_min: 5
    power_pct_ftp: 50
    note: Recovery
  - duration_min: 10
    power_pct_ftp: 98
    note: Threshold 3
  - duration_min: 5
    power_pct_ftp: 50
    note: Recovery
  - duration_min: 10
    power_pct_ftp: 98
    note: Threshold 4
  - duration_min: 5
    power_pct_ftp: 50
    note: Recovery
  - duration_min: 10
    power_pct_ftp: 98
    note: Threshold 5 — hold form
  - duration_min: 10
    power_pct_ftp: 45
    note: Cool-down
